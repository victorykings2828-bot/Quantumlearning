# Every command below exists in this repository and was run locally before this
# workflow was installed. No step calls a paid or quota-consuming model endpoint.
#
# Action pinning: the supplied major-version tags are retained. Before the
# release baseline, resolve the official releases and pin full commit SHAs with
# version comments, as GitHub's secure-use guidance recommends. No SHA is
# invented here.
name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: quantum
          POSTGRES_PASSWORD: ci_ephemeral_only
          POSTGRES_DB: quantum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quantum -d quantum_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://quantum:ci_ephemeral_only@localhost:5432/quantum_test
      SESSION_SECRET: ci-ephemeral-not-a-production-secret-0000000000000000
      COOKIE_SECURE: "false"
      PUBLIC_ORIGIN: http://127.0.0.1:5173
      TUTOR_PROVIDER: fake
      TUTOR_USAGE_MODE: internal_evaluation
      NVIDIA_API_KEY: ""
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned uv
        run: python -m pip install uv==0.12.12
      - name: Install backend from lock
        run: uv sync --frozen
        working-directory: backend
      - name: Check backend lock consistency
        run: uv lock --check
        working-directory: backend
      - name: Apply migrations
        run: uv run --frozen alembic upgrade head
        working-directory: backend
      - name: Backend and integration tests
        run: uv run --frozen pytest -q
        working-directory: backend
      - name: Backend lint
        run: uv run --frozen ruff check .
        working-directory: backend
      - name: Backend formatting
        run: uv run --frozen ruff format --check .
        working-directory: backend
      - name: Validate authored content and references
        run: uv run --frozen python -m app.tools.validate_content
        working-directory: backend
      - name: Verify backend contract export
        run: uv run --frozen python export_contracts.py --check
        working-directory: backend
      - name: Install frontend
        run: npm ci
        working-directory: frontend
      - name: Generate API types
        run: npm run generate:types
        working-directory: frontend
      - name: Require committed contract artifacts
        run: git ls-files --error-unmatch contracts/openapi.json frontend/src/api/schema.d.ts
      - name: Check generated contract drift
        run: git diff --exit-code -- contracts/openapi.json frontend/src/api/schema.d.ts
      - name: Frontend lint
        run: npm run lint
        working-directory: frontend
      - name: TypeScript check
        run: npm run typecheck
        working-directory: frontend
      - name: Frontend unit tests
        run: npm run test:unit
        working-directory: frontend
      - name: Frontend production build
        run: npm run build
        working-directory: frontend
      - name: Frontend formatting
        run: npm run format:check
        working-directory: frontend
      - name: Install browser dependencies
        run: npx --no-install playwright install --with-deps chromium
        working-directory: frontend
      - name: Create and migrate the browser-test database
        run: |
          PGPASSWORD=ci_ephemeral_only psql -h localhost -U quantum -d quantum_test \
            -c 'CREATE DATABASE quantum_e2e OWNER quantum;'
          DATABASE_URL=postgresql+psycopg://quantum:ci_ephemeral_only@localhost:5432/quantum_e2e \
            uv run --frozen alembic upgrade head
        working-directory: backend
      - name: Browser E2E against real API and database
        # playwright.config.ts starts FastAPI and Vite itself, against a
        # dedicated database so it cannot race the backend unit fixtures.
        env:
          E2E_DATABASE_URL: postgresql+psycopg://quantum:ci_ephemeral_only@localhost:5432/quantum_e2e
        run: npm run test:e2e
        working-directory: frontend
      - name: Scan the built frontend for secrets and answer keys
        # The essential-item numbers are published pass policy and are shown to
        # learners, so they are not a leak. These markers are.
        run: |
          set -e
          if grep -rslE 'nvapi-[A-Za-z0-9_-]{8}|NVIDIA_API_KEY|"answer_key"|chapter-1-task-rubrics' frontend/dist; then
            echo 'A credential or private assessment artefact reached the built frontend.'
            exit 1
          fi
          echo 'No credential or answer-key artefact found in the built frontend.'
      - name: Confirm private content is not served by learner endpoints
        run: uv run --frozen pytest -q tests/test_content_integrity.py
        working-directory: backend
      - name: Production container build
        run: docker build -f infra/Dockerfile.backend -t quantum-backend:ci .
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-diagnostics
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
