name: Checks
on:
  push:
    branches-ignore: [coordination]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install uv==0.12.12
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run --frozen pytest -q
        working-directory: backend
      - run: uv run --frozen ruff check . && uv run --frozen ruff format --check .
        working-directory: backend
      - run: uv run --frozen python export_contracts.py --check
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run generate:types && git diff --exit-code -- src/api/schema.d.ts
        working-directory: frontend
      - run: npm run lint && npm run build && npm run format:check
        working-directory: frontend
